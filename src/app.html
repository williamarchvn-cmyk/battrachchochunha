<title>Bát Trạch cho chủ nhà</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700&display=swap">
<style>
/* Layout: dải tiêu đề + thanh 5 bước; vùng làm việc 3 cột (công cụ · mặt bằng · thuộc tính), gập 1 cột trên điện thoại.
   Chất liệu: giấy kem, mực đen, đỏ son như dấu triện; xanh ngọc cho kiết, đỏ cho hung. */
:root{
  --paper:#f5f0e5; --paper-2:#ece4d3; --card:#fffcf6; --ink:#1f1a15; --ink-2:#4b4239; --muted:#7b7064;
  --line:#ddd1bc; --line-strong:#b7a88f;
  --son:#9c2a21; --son-ink:#fffaf3; --son-soft:#f2ddd6; --gold:#94742f;
  --kiet:#24704f; --kiet-soft:#d9ecdf; --hung:#b1261d; --hung-soft:#f6dbd6; --warn:#b5651b; --warn-soft:#f5e3cd;
  --info:#45607a; --info-soft:#dfe7ee;
  --m-door:#9c2a21; --m-fire:#c4661c; --m-altar:#8a6a22; --m-sleep:#3c628a; --m-water:#2c7c86; --m-misc:#6d6257;
  --f-display:"Noto Serif", "Times New Roman", Georgia, serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
  /* Trang báo cáo in: cố định một tông giấy sáng ở mọi chế độ */
  --rp-paper:#fbf8f1; --rp-ink:#1f1a15; --rp-muted:#6f655a; --rp-line:#dccfb9; --rp-son:#9c2a21; --rp-kiet:#24704f; --rp-hung:#b1261d; --rp-warn:#b5651b; --rp-soft:#f1e9da;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15120f; --paper-2:#1d1915; --card:#201b17; --ink:#efe6d7; --ink-2:#d2c5b2; --muted:#9d907f;
  --line:#3a322a; --line-strong:#5c5044;
  --son:#e2715f; --son-ink:#1b0e0b; --son-soft:#3b1e19; --gold:#d3b067;
  --kiet:#62c391; --kiet-soft:#173226; --hung:#f07b6f; --hung-soft:#3b1a16; --warn:#e8a35c; --warn-soft:#35261a;
  --info:#9cb7d1; --info-soft:#1d2833;
  --m-door:#e2715f; --m-fire:#e8a35c; --m-altar:#d3b067; --m-sleep:#86aed6; --m-water:#6cc3cc; --m-misc:#b3a594;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#15120f; --paper-2:#1d1915; --card:#201b17; --ink:#efe6d7; --ink-2:#d2c5b2; --muted:#9d907f;
  --line:#3a322a; --line-strong:#5c5044;
  --son:#e2715f; --son-ink:#1b0e0b; --son-soft:#3b1e19; --gold:#d3b067;
  --kiet:#62c391; --kiet-soft:#173226; --hung:#f07b6f; --hung-soft:#3b1a16; --warn:#e8a35c; --warn-soft:#35261a;
  --info:#9cb7d1; --info-soft:#1d2833;
  --m-door:#e2715f; --m-fire:#e8a35c; --m-altar:#d3b067; --m-sleep:#86aed6; --m-water:#6cc3cc; --m-misc:#b3a594;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.45rem} h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{border-bottom:1px solid var(--line);background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.32rem;font-weight:700;letter-spacing:.01em;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:.82rem}
.proj{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proj select{max-width:260px}
.demo-flag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;background:var(--son-soft);color:var(--son);padding:3px 8px;border-radius:99px;font-weight:600}

/* Steps */
.steps{border-bottom:1px solid var(--line);background:var(--paper-2)}
.steps .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:0}
.steps button{border:0;background:none;padding:12px 14px;display:flex;align-items:center;gap:9px;cursor:pointer;white-space:nowrap;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:500}
.steps button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;border:1px solid var(--line-strong);font-weight:600}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--son)}
.steps button[aria-current="step"] .n{background:var(--son);border-color:var(--son);color:var(--son-ink)}
.steps button.done .n{border-color:var(--kiet);color:var(--kiet)}
main{padding-block:20px 48px}

/* Controls */
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:.92rem;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--son);border-color:var(--son);color:var(--son-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line-strong)}
.btn.sm{padding:4px 9px;font-size:.84rem}
.btn.danger{color:var(--hung);border-color:var(--hung)}
:focus-visible{outline:2px solid var(--son);outline-offset:2px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--card);border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
label.f{display:grid;gap:4px;font-size:.84rem;color:var(--ink-2);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:6px 10px;cursor:pointer;font-size:.86rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:12px}
.panel h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cite{display:inline-block;font-size:.74rem;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:99px;padding:0 7px;white-space:nowrap;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:600;white-space:nowrap}
.lv-dh{background:var(--hung);color:var(--son-ink)} .lv-th{background:var(--hung-soft);color:var(--hung)} .lv-ly{background:var(--warn-soft);color:var(--warn)}
.lv-in{background:var(--info-soft);color:var(--info)} .lv-t{background:var(--kiet-soft);color:var(--kiet)} .lv-rt{background:var(--kiet);color:var(--son-ink)}
.k{color:var(--kiet);font-weight:600} .h{color:var(--hung);font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line-strong);padding:6px 8px}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.tbl{overflow-x:auto}

/* Step 1 */
.s1{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.s1{grid-template-columns:minmax(0,1fr)}}
.cung-hero{display:flex;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.cung-hero .tg{color:var(--son)}
.cung-hero .big{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.mem-row{display:grid;grid-template-columns:1.4fr 1fr 1.1fr .9fr auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.mem-row{grid-template-columns:1fr 1fr}}
.mem-cung{font-size:.84rem;padding-bottom:7px}

/* Step 2 editor */
.ed{display:grid;grid-template-columns:62px minmax(0,1fr) 330px;gap:12px;align-items:start}
@media (max-width:1100px){.ed{grid-template-columns:minmax(0,1fr)} .tools{flex-direction:row!important;overflow-x:auto} .tools hr{display:none}}
.tools{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.tools hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:100%}
.tool{border:1px solid transparent;background:none;border-radius:8px;padding:5px 2px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:.62rem;line-height:1.1;color:var(--ink-2);min-width:52px}
.tool:hover{border-color:var(--line-strong)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool .g{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.72rem;color:#fff}
.tool svg{width:22px;height:22px}
.stage{min-width:0}
.canvas{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.canvas svg{display:block;width:100%;height:auto;max-height:74vh}
.canvas.tool-add{cursor:crosshair}
.hint{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 2px;font-size:.86rem;color:var(--ink-2)}
.floors{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.floors .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drop{border:2px dashed var(--line-strong);border-radius:var(--r);padding:48px 20px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--card)}
.drop.over{border-color:var(--son);background:var(--son-soft)}
.side .panel{padding:14px}
.dirs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.dirs button{font-size:.78rem;padding:5px 2px}
.dirs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.stack{display:grid;gap:10px}
.dial{display:flex;gap:12px;align-items:center}

/* Step 3 */
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--son);flex:none}
.check.on{border-color:var(--son);background:var(--son-soft)}
.check.good.on{border-color:var(--kiet);background:var(--kiet-soft)}
.check b{display:block;font-weight:600}

/* Step 4 */
.res{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
@media (max-width:1150px){.res{grid-template-columns:minmax(0,1fr)}}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score .ring{flex:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.fact{border-left:3px solid var(--line-strong);padding:2px 0 2px 10px}
.fact .v{font-weight:600}
.fact.good{border-color:var(--kiet)} .fact.bad{border-color:var(--hung)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--son)}
.flist{display:grid;gap:8px}
.fi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left}
.fi:hover,.fi.hl{border-color:var(--ink-2)}
.fi .pin{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:700;color:#fff}
.fi .tt{font-weight:600;line-height:1.35}
.fi .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.fi .dt{font-size:.88rem;color:var(--ink-2)}
.fi .fx{font-size:.86rem;margin-top:6px;padding:6px 9px;border-radius:7px;background:var(--kiet-soft);color:var(--ink)}
.grp{margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.note{font-size:.84rem;color:var(--ink-2);background:var(--paper-2);border-radius:8px;padding:10px 12px}
.yr td.g{color:var(--kiet)} .yr td.b{color:var(--hung)}

/* Step 5 */
.rp-preview{display:flex;flex-wrap:wrap;gap:16px}
.rp-thumb{width:calc(794px * .36);height:calc(1123px * .36);overflow:hidden;border:1px solid var(--line-strong);box-shadow:0 2px 10px color-mix(in srgb,var(--ink) 12%,transparent);background:var(--rp-paper);flex:none}
.rp-thumb > .rp{transform:scale(.36);transform-origin:0 0}
@media (max-width:640px){.rp-thumb{width:calc(794px * .42);height:calc(1123px * .42)} .rp-thumb > .rp{transform:scale(.42)}}
#reportStage{position:absolute;left:-20000px;top:0}

/* Report page (A4 @96dpi) */
.rp{width:794px;height:1123px;background:var(--rp-paper);color:var(--rp-ink);font:12.5px/1.5 var(--f-body);display:flex;flex-direction:column;padding:44px 52px 36px;position:relative;overflow:hidden}
.rp *{color:inherit}
.rp-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rp-line);padding-bottom:8px;margin-bottom:16px;font-size:10.5px;color:var(--rp-muted);letter-spacing:.06em;text-transform:uppercase}
.rp-head b{color:var(--rp-son);font-family:var(--f-display);font-size:12px;letter-spacing:.02em;text-transform:none}
.rp-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.rp-foot{display:flex;justify-content:space-between;border-top:1px solid var(--rp-line);padding-top:7px;margin-top:10px;font-size:10px;color:var(--rp-muted)}
.rp h2{font-size:20px;color:var(--rp-ink)} .rp h3{font-size:14.5px;color:var(--rp-son)}
.rp table{width:100%;border-collapse:collapse;font-size:11.5px}
.rp th{text-align:left;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--rp-muted);border-bottom:1px solid var(--rp-ink);padding:4px 6px}
.rp td{border-bottom:1px solid var(--rp-line);padding:5px 6px;vertical-align:top}
.rp .rk{color:var(--rp-kiet);font-weight:600} .rp .rh{color:var(--rp-hung);font-weight:600} .rp .rw{color:var(--rp-warn);font-weight:600}
.rp .item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--rp-line)}
.rp .item .pn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:10px}
.rp .item .tt{font-weight:600}
.rp .item .dt{color:#3f372f}
.rp .item .fx{margin-top:3px;color:var(--rp-kiet)}
.rp .tag{display:inline-block;font-size:9.5px;font-weight:700;border-radius:99px;padding:0 6px;margin-right:4px}
.rp .plan{width:100%;border:1px solid var(--rp-line)}
.rp .box{background:var(--rp-soft);border-radius:6px;padding:10px 12px}
.cover{padding:0;background:var(--rp-paper)}
.cover .band{background:var(--rp-son);color:#fbf3e8;padding:48px 52px 36px}
.cover .band *{color:#fbf3e8}
.cover .inner{padding:30px 52px;display:flex;flex-direction:column;gap:18px;flex:1}

/* Misc */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:.9rem;max-width:min(560px,calc(100vw - 32px));z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.modal-bg{position:fixed;inset:0;background:rgba(20,15,10,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--card);border-radius:12px;max-width:520px;width:100%;padding:20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:6px;display:grid;min-width:220px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--paper-2)}
footer.foot{border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
footer.foot .wrap{padding-block:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,2 32.7,7.3 38,20 32.7,32.7 20,38 7.3,32.7 2,20 7.3,7.3" fill="none" stroke="var(--son)" stroke-width="2.2"/><polygon points="20,10 27.1,12.9 30,20 27.1,27.1 20,30 12.9,27.1 10,20 12.9,12.9" fill="var(--son)"/><circle cx="20" cy="20" r="3.2" fill="var(--paper)"/></svg>
    <div><b>Bát Trạch cho chủ nhà</b><small>Đối chiếu mặt bằng nhà theo sách Kim Oanh Ký</small></div>
  </div>
  <div class="proj" style="position:relative">
    <span id="demoFlag" class="demo-flag" hidden>Hồ sơ giả định</span>
    <label for="projSel" class="sr">Dự án</label>
    <select id="projSel"></select>
    <button class="btn" data-act="new-project">+ Dự án mới</button>
    <button class="btn ghost" data-act="menu" aria-label="Thao tác dự án" aria-haspopup="true">⋯</button>
    <div id="menu" class="menu" hidden>
      <button data-act="rename">Đổi tên dự án</button>
      <button data-act="duplicate">Nhân bản dự án</button>
      <button data-act="restore-demos">Khôi phục dự án mẫu</button>
      <button data-act="delete-project" class="h">Xoá dự án này</button>
    </div>
  </div>
</div></header>
<nav class="steps" aria-label="Các bước"><div class="wrap" id="stepNav"></div></nav>
<main><div class="wrap" id="view"></div></main>
<footer class="foot"><div class="wrap"><span>Bát Trạch cho chủ nhà · by Nguyễn Mạnh Hùng · Bản xem trước</span><span>Dữ liệu chỉ lưu trên trình duyệt của bạn. Kết quả mang tính tham khảo theo sách cổ, không thay thế tư vấn kiến trúc – kết cấu.</span></div></footer>
<div id="toast" hidden></div>
<div id="modalRoot"></div>
<div id="reportStage" aria-hidden="true"></div>
<input type="file" id="fileIn" accept="image/*,application/pdf" hidden>

<script>
'use strict';

function jdOf(y,m,d,h=0){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+h/24+B-1524.5}
function sunLong(jd){const T=(jd-2451545)/36525,r=Math.PI/180;const L0=280.46646+36000.76983*T+.0003032*T*T,M=357.52911+35999.05029*T-.0001537*T*T;const C=(1.914602-.004817*T-.000014*T*T)*Math.sin(M*r)+(.019993-.000101*T)*Math.sin(2*M*r)+.000289*Math.sin(3*M*r);const om=125.04-1934.136*T;return mod(L0+C-.00569-.00478*Math.sin(om*r),360)}
function jdToDate(jd){const Z=Math.floor(jd+.5),F=jd+.5-Z;const al=Math.floor((Z-1867216.25)/36524.25);const A=Z+1+al-Math.floor(al/4),B=A+1524,C=Math.floor((B-122.1)/365.25),D=Math.floor(365.25*C),E=Math.floor((B-D)/30.6001);const day=B-D-Math.floor(30.6001*E)+F;const m=E<14?E-1:E-13,y=m>2?C-4716:C-4715,d=Math.floor(day),hr=(day-d)*24;return{y,m,d,h:Math.floor(hr),mi:Math.floor((hr%1)*60)}}
const _lx={};
function lapXuan(y){ if(_lx[y]) return _lx[y]; let a=jdOf(y,1,25),b=jdOf(y,2,15); for(let i=0;i<60;i++){const m=(a+b)/2;const d=mod(sunLong(m)-315+180,360)-180; if(d<0)a=m; else b=m;} return _lx[y]=jdToDate((a+b)/2+7/24); }
function cungPhi(dob,gender,tob){
  if(!dob||!/^\d{4}-\d{2}-\d{2}$/.test(dob)) return null;
  const [Y,M,D]=dob.split('-').map(Number); const lx=lapXuan(Y); let y=Y,onDay=false;
  const cmp=(M*100+D)-(lx.m*100+lx.d);
  if(cmp<0) y=Y-1; else if(cmp===0){ if(tob&&/^\d{1,2}:\d{2}/.test(tob)){const[h,mi]=tob.split(':').map(Number); if(h*60+mi<lx.h*60+lx.mi) y=Y-1;} else onDay=true; }
  const r=mod(y,9); let n=gender==='nu'?mod(r+4,9):mod(11-r,9); if(n===0)n=9;
  const center=n===5; const q=center?(gender==='nu'?'gen':'kun'):NUM2Q[n];
  return {Y,y,lx,n,q,center,onDay,shifted:y!==Y,gender};
}

/* ================= Hình học ================= */
function polyArea(pts){let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p[0]*q[1]-q[0]*p[1];}return a/2;}
function centroid(pts){const A=polyArea(pts);if(Math.abs(A)<1e-6){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return[(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2];}let cx=0,cy=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length],f=p[0]*q[1]-q[0]*p[1];cx+=(p[0]+q[0])*f;cy+=(p[1]+q[1])*f;}return[cx/(6*A),cy/(6*A)];}
function inPoly(pt,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))c=!c;}return c;}
function geo(p,f){
  if(!f||!f.outline||f.outline.length<3) return null;
  const pts=f.outline, xs=pts.map(a=>a[0]), ys=pts.map(a=>a[1]);
  const bb={x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)}; bb.w=bb.x1-bb.x0; bb.h=bb.y1-bb.y0;
  if(bb.w<2||bb.h<2) return null;
  const c=f.center||centroid(pts), front=f.front||p.orient.front, fa=FRONT_ANG[front], F=+p.orient.facing||0;
  const mw=+f.meters?.w, mh=+f.meters?.h, ppm=(mw>0&&mh>0)?(bb.w/mw+bb.h/mh)/2:Math.max(bb.w,bb.h)/15;
  const grid=p.orient.division==='grid';
  const bearing=pt=>mod(imgAng(pt[0]-c[0],pt[1]-c[1])-fa+F,360);
  const imgOfB=b=>mod(b-F+fa,360), bOfImg=a=>mod(a-fa+F,360);
  const cell=pt=>[clamp(Math.floor((pt[0]-bb.x0)/bb.w*3),0,2),clamp(Math.floor((pt[1]-bb.y0)/bb.h*3),0,2)];
  const inCenter=pt=>{const[a,b]=cell(pt);return a===1&&b===1;};
  const sectorAt=pt=>{ if(grid){const[a,b]=cell(pt); if(a===1&&b===1) return null; return SO[secIdx(bOfImg(imgAng(a-1,b-1)))];} return SO[secIdx(bearing(pt))]; };
  const N=46, st={}; SO.concat('center').forEach(k=>st[k]={tot:0,in:0,sx:0,sy:0});
  const inside=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const pt=[bb.x0+(i+.5)*bb.w/N,bb.y0+(j+.5)*bb.h/N];const k=sectorAt(pt)||'center';st[k].tot++;if(inPoly(pt,pts)){st[k].in++;st[k].sx+=pt[0];st[k].sy+=pt[1];inside.push(pt);}}
  const khuyet=SO.filter(k=>st[k].tot>=N*N*.03&&(1-st[k].in/st[k].tot)>=.25);
  const lab={}; SO.forEach(k=>{if(st[k].in>N*N*.006) lab[k]=[st[k].sx/st[k].in,st[k].sy/st[k].in];});
  return {pts,bb,c,fa,F,ppm,grid,front,bearing,imgOfB,bOfImg,sectorAt,inCenter,cell,st,khuyet,lab,inside,sonAt:pt=>SON24[sonIdx(bearing(pt))],m:px=>px/ppm};
}
function nearestIn(g,from,okFn,avoidCenter=true){let best=null,bd=1e18;for(const pt of g.inside){if(avoidCenter&&g.inCenter(pt))continue;const q=g.sectorAt(pt);if(!q)continue;const pen=okFn(q);if(pen==null||pen===false)continue;const d=dist(pt,from)+(typeof pen==='number'?pen*g.ppm:0);if(d<bd){bd=d;best=pt;}}return best;}
function edgeSlide(g,pt,okFn){ // dịch điểm (cửa) dọc theo cạnh đường bao gần nhất
  let be=null,bd=1e18; const P=g.pts;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];const t=clamp(((pt[0]-a[0])*(b[0]-a[0])+(pt[1]-a[1])*(b[1]-a[1]))/((b[0]-a[0])**2+(b[1]-a[1])**2||1),0,1);const q=[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])];const d=dist(q,pt);if(d<bd){bd=d;be=[a,b];}}
  if(!be||bd>g.ppm*1.5) return null;
  const [a,b]=be, L=dist(a,b), step=g.ppm*.2; let best=null,bdist=1e18;
  for(let s=g.ppm*.4;s<=L-g.ppm*.4;s+=step){const q=[a[0]+(b[0]-a[0])*s/L,a[1]+(b[1]-a[1])*s/L];if(okFn(q)){const d=dist(q,pt);if(d<bdist){bdist=d;best=q;}}}
  return best?{pt:best,m:g.m(bdist)}:null;
}
function rayFrame(c,a,fr){const[dx,dy]=dirVec(a);let t=1e9;if(dx>1e-9)t=Math.min(t,(fr.x1-c[0])/dx);if(dx<-1e-9)t=Math.min(t,(fr.x0-c[0])/dx);if(dy>1e-9)t=Math.min(t,(fr.y1-c[1])/dy);if(dy<-1e-9)t=Math.min(t,(fr.y0-c[1])/dy);return[c[0]+dx*t,c[1]+dy*t];}
const imgDirWord=a=>['lên trên','chéo lên phải','sang phải','chéo xuống phải','xuống dưới','chéo xuống trái','sang trái','chéo lên trái'][Math.floor(mod(a+22.5,360)/45)];

const roleVi=r=>({giatruong:'Gia trưởng',truongtu:'Trưởng tử (thay gia trưởng)',me:'Mẹ làm chủ nhà'}[r]||'Gia trưởng');
function trachOf(p){const F=+p.orient.facing||0;return SO[secIdx(p.orient.trach==='cua'?F:mod(F+180,360))];}
function markerName(p,fi,m){ if(m.label) return m.label; const f=p.floors[fi]; const same=(f.markers||[]).filter(x=>x.type===m.type); const i=same.indexOf(m); return typeName(p,m.type)+(same.length>1?' '+(i+1):'')+(p.floors.length>1?' · '+(f.name||'Tầng '+(fi+1)):''); }
function evaluate(p){
  const R={F:[],score:[],fixes:[],folk:[],years:[],kl:[],assign:[],people:[]};

  // 1. Mạng – trạch

  sc('Mạng chủ nhà – trạch',10,ts.q);
  // 2. Cửa chính

  else{
    door=doors.sort((a,b)=>a.fi-b.fi)[0]; const g=door.g, q=g.sectorAt(door.pt), son=g.sonAt(door.pt);

      const ts2=TAO_SON[son]; if(ts2!=null) add({level:ts2?'tot':(s.good?'thu-hung':'luu-y'),area:'Bếp',title:`${nm} ở sơn ${son}: ${ts2?'sơn kiết cho bếp':'sơn kỵ đặt bếp'}`,detail:ts2?'Theo bài "Khai táo môn lệ", sơn này đặt bếp được tài lộc.':`Theo bài "Khai táo môn lệ", sơn ${son} kỵ đặt bếp.${s.good?'':' Vì cung đã đúng phép nên chỉ là tiểu hung (luận mạng mà không luận sơn).'}${son==='Mão'?' Sách còn ghi bếp ở phương Mão thì phụ nữ trong nhà yếu.':''}${son==='Cấn'?' Bếp ở bên Cấn thì gia đạo không nghiêm.':''}`,cite:'tr. 102–103, 140',fi:x.fi,pt:x.pt,mid:x.m.id});

function renderS5(v){v.innerHTML=`<div class="panel" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><h2>Báo cáo PDF</h2><p class="muted small">Khổ A4, gồm bìa, hồ sơ cung phi, mặt bằng có đánh giá, đề xuất bố trí, xếp phòng, năm tháng và tuổi làm nhà.</p></div><div class="row"><button class="btn" data-act="build-report">Làm mới bản xem</button><button class="btn primary" data-act="pdf" id="pdfBtn">Tải PDF</button></div></div><p class="tiny muted" id="pdfNote" style="margin-top:6px"></p></div><div class="rp-preview" id="rpPrev"><p class="muted"><span class="spin"></span> Đang dựng báo cáo…</p></div>`;buildReport().catch(e=>{console.error(e);$('#rpPrev').innerHTML='<p class="h">Không dựng được báo cáo: '+esc(e.message)+'</p>';});}
async function toDataURL(src){if(!src||src.startsWith('data:'))return src;const r=await fetch(src);const b=await r.blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}
function svgToPng(svg,maxW=1500){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const w=img.naturalWidth||img.width||1000,h=img.naturalHeight||img.height||700;const k=Math.min(1,maxW/w)*(w<900?1600/w:1);const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);const cx=cv.getContext('2d');cx.fillStyle='#fbf8f1';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);try{res(cv.toDataURL('image/jpeg',.9));}catch(e){rej(e);}};img.onerror=()=>rej(new Error('Không vẽ được ảnh mặt bằng'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
const lvTag=l=>`<span class="tag" style="background:${LV[l].col};color:#fff">${LV[l].vi}</span>`;
async function buildReport(){
  const p=P(),R=evaluate(p),stage=$('#reportStage');stage.innerHTML='';
  if(R.error){$('#rpPrev').innerHTML=`<p>${R.error}</p>`;return;}
  if(document.fonts&&document.fonts.ready) await document.fonts.ready;
  const O=R.O, today=new Date().toLocaleDateString('vi-VN');
  const plans=[],fixes=[];
  for(let fi=0;fi<p.floors.length;fi++){const f=p.floors[fi];if(!f.img||!geo(p,f)){plans.push(null);fixes.push(null);continue;}const d=await toDataURL(f.img);plans.push(await svgToPng(svgPlan(p,fi,{mode:'result',R,exp:true,img:d,labels:false})));fixes.push(R.fixes.some(z=>z.fi===fi)?await svgToPng(svgPlan(p,fi,{mode:'fix',R,exp:true,img:d})):null);}
  const bagua=await svgToPng(baguaSVG(O,true,300),600);

  const newPage=(sec)=>{const el=document.createElement('div');el.className='rp';el.innerHTML=head(sec)+'<div class="rp-body"></div><div class="rp-foot"><span>'+esc(p.name)+' · '+today+'</span><span class="pg"></span></div>';stage.appendChild(el);pages.push(el);return el.querySelector('.rp-body');};
  const flow=async(sec,blocks)=>{let body=newPage(sec);for(const b of blocks){const t=document.createElement('div');t.innerHTML=b;const el=t.firstElementChild||t;body.appendChild(el);for(const im of (el.tagName==='IMG'?[el]:el.querySelectorAll('img'))){try{await im.decode();}catch(e){}}if((el.getBoundingClientRect().bottom-body.getBoundingClientRect().top)>body.clientHeight-24&&body.children.length>1){body.removeChild(el);body=newPage(sec);body.appendChild(el);}}};
  // Bìa
  const cov=document.createElement('div');cov.className='rp cover';const top3=R.F.filter(x=>['dai-hung','thu-hung'].includes(x.level)).slice(0,4);
  cov.innerHTML=`<div class="band"><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.85">Báo cáo phong thủy mặt bằng · Bát Trạch</div><div style="font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.15;margin-top:10px">${esc(p.name)}</div><div style="margin-top:8px;font-size:14px">Gia trưởng ${esc(p.owner.name||'')} · cung ${QUAI[O].vi} (${QUAI[O].group} tứ mạng)</div></div>
   <div class="inner"><div style="display:flex;gap:28px;align-items:center"><div style="width:150px;height:150px;border-radius:50%;border:10px solid ${R.total>=65?'#24704f':R.total>=50?'#b5651b':'#b1261d'};display:grid;place-items:center;flex:none"><div style="text-align:center"><div style="font-family:var(--f-display);font-size:46px;font-weight:700;line-height:1">${R.total}</div><div style="font-size:11px;color:var(--rp-muted)">/ 100 điểm</div></div></div>
    <div><div style="font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--rp-son)">${R.grade}</div><table style="margin-top:8px;font-size:12.5px"><tr><td>${isCH(p)?'Căn hộ':'Nhà'}</td><td><b>${QUAI[R.tq].vi} trạch</b> (${isCH(p)?'cửa căn hộ':'mặt tiền'} ${QUAI[SO[secIdx(p.orient.facing)]].dir}, ${p.orient.facing}°) · ${R.ts.vi}</td></tr><tr><td>${DN(p)}</td><td><b>${R.dstar?R.dstar.vi:'chưa đánh dấu'}</b>${R.doorQ?' · '+QUAI[R.doorQ].dir:''}</td></tr><tr><td>Bếp nên quay</td><td><b>${QUAI[qOfStar(O,R.recStar)].dir}</b> (${STARS[R.recStar].vi})</td></tr><tr><td>Số tầng</td><td>${p.floors.length}</td></tr></table></div></div>

    <div class="box" style="margin-top:auto;font-size:11px;color:#4a4036">Đánh giá dựa trên phần Bát Trạch Minh Cảnh và Bát Lãm Quần Thơ trong sách <i>Kim Oanh Ký</i> (Thái Kim Oanh, NXB Lao Động, 2008); số trang ghi kèm từng mục. Nội dung mang tính tham khảo văn hóa, không thay thế tư vấn kiến trúc, kết cấu. Lập ngày ${today}.</div></div>
   <div class="rp-foot" style="padding:8px 52px 30px;margin:0"><span>Bát Trạch cho chủ nhà · by Nguyễn Mạnh Hùng</span><span class="pg"></span></div>`;

  // Hồ sơ
  const c=R.oc;
  await flow('Hồ sơ gia đình',[
   `<div><h2>Hồ sơ gia đình và cung phi</h2></div>`,
   `<div style="display:flex;gap:18px;align-items:flex-start"><img src="${bagua}" style="width:230px;flex:none"><div class="box" style="flex:1"><b>Cách tính cung của gia trưởng.</b> Sinh ngày ${p.owner.dob.split('-').reverse().join('/')}${p.owner.gender==='nu'?', nữ':', nam'}. Lập Xuân năm ${c.Y} là ${lxText(c.lx)}; ${c.shifted?'sinh trước Lập Xuân nên tính theo năm '+c.y:'tính theo năm '+c.y} (${canChi(c.y)}). ${c.gender==='nu'?'Nữ khởi ngũ Trung đếm nghịch':'Nam khởi Khảm đếm thuận'} ra số ${c.n}${c.center?' (Ngũ Trung, '+(c.gender==='nu'?'nữ tính Cấn':'nam tính Khôn')+')':''}: <b>cung ${QUAI[c.q].vi}</b>, ${QUAI[c.q].group} tứ mạng. <span style="color:var(--rp-muted)">(tr. 69–75)</span></div></div>`,
   `<table><thead><tr><th>Phương</th><th>Cung</th><th>Sao</th><th>Mức</th><th>Ứng năm</th></tr></thead><tbody>${STAR_ORDER.map(k=>{const q=qOfStar(O,k),s=STARS[k];return `<tr><td><b>${QUAI[q].dir}</b></td><td>${QUAI[q].vi}</td><td class="${s.good?'rk':'rh'}">${s.vi}</td><td>${s.lv}</td><td>${s.ung.join(', ')}</td></tr>`;}).join('')}</tbody></table>`,
   `<div><h3>Thành viên</h3><table><thead><tr><th>Họ tên</th><th>Quan hệ</th><th>Năm tính</th><th>Cung</th></tr></thead><tbody>${R.people.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.rel||'')}</td><td>${x.c?x.c.y:'–'}</td><td>${x.c?QUAI[x.c.q].vi+' ('+QUAI[x.c.q].group+')':'–'}</td></tr>`).join('')}</tbody></table></div>`]);
  // Mặt bằng
  for(let fi=0;fi<p.floors.length;fi++){const f=p.floors[fi];if(!plans[fi])continue;const list=R.F.concat(R.folk).filter(x=>x.fi===fi&&x.n);
    await flow('Mặt bằng',[`<div><h2>${esc(f.name||'Tầng '+(fi+1))}: đánh giá trên mặt bằng</h2><p style="color:var(--rp-muted)">Xanh là phương kiết, đỏ là phương hung của gia trưởng cung ${QUAI[O].vi}. Số trên hình khớp với danh sách.</p></div>`,`<img class="plan" src="${plans[fi]}">`,...list.map(x=>`<div class="item"><span class="pn" style="background:${x.cat==='dangian'?'#6b5ca5':LV[x.level].col}">${x.n}</span><div><div class="tt">${x.cat==='dangian'?'<span class="tag" style="background:#6b5ca5;color:#fff">Dân gian</span>':lvTag(x.level)}${esc(x.title)}</div><div class="dt">${esc(x.detail)}${x.cite?' <span style="color:var(--rp-muted)">('+x.cite+')</span>':''}</div>${x.fix?`<div class="fx">→ ${esc(x.fix)}</div>`:''}</div></div>`)]);}
